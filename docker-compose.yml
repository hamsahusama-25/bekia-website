name: loop-eco

services:
  mongo:
    image: mongo:7
    container_name: ecoloop-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017" # localhost only: this dev database has no authentication
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ecoloop-net]

  backend:
    build: ./backend
    container_name: ecoloop-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ecoloop
      MONGO_TEST_URI: mongodb://mongo:27017/ecoloop_test # used only by `npm test`
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      SEED_PASSWORD: ${SEED_PASSWORD:-EcoLoop@2026}
      APP_TZ: ${APP_TZ:-Africa/Cairo}
      UPLOAD_DIR: /app/uploads
      TRUST_PROXY: 1 # the frontend container is the only proxy in front of the API
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks: [ecoloop-net]

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:5000
    container_name: ecoloop-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [ecoloop-net]

volumes:
  mongo_data:
  uploads_data:

networks:
  ecoloop-net:
    driver: bridge
